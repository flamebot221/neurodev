<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f4">
  <title>NeuroDev — Today</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="NeuroDev Today"><span class="brand-mark">N</span> NEURODEV</a>
    <nav id="nav" aria-label="Main navigation"></nav>
    <div class="header-actions">
      <button class="quiet-button" id="export-button" type="button">Export</button>
      <label class="quiet-button import-label" for="import-file">Import</label>
      <input id="import-file" type="file" accept="application/json,.json">
      <button class="quiet-button" id="sync-button" type="button" title="Check for a newly published website version">Sync site</button>
    </div>
  </header>
  <main id="app" tabindex="-1" aria-live="polite"></main>
  <footer><span id="save-status" role="status" aria-live="polite">Saved in this browser</span><span>Static site · local data</span></footer>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
