name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html app.js data.js style.css _site/
          sed -i "s|style.css|style.css?v=$GITHUB_SHA|; s|data.js|data.js?v=$GITHUB_SHA|; s|app.js|app.js?v=$GITHUB_SHA|" _site/index.html
          printf '{"commit":"%s"}\n' "$GITHUB_SHA" > _site/version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
